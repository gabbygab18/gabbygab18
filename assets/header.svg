  <rect x="0.5" y="0.5" width="879" height="249" rx="18" fill="none" stroke="#FFC107" stroke-opacity="0.28" />

  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
