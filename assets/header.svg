    <circle cx="810" cy="-40" r="150" fill="#FFC107" opacity="0.07" />
    <circle cx="60" cy="290" r="130" fill="#FF9016" opacity="0.06" />
    <circle cx="110" cy="70" r="3" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="70;56;70" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" begin="0s" repeatCount="indefinite" /></circle><circle cx="770" cy="90" r="2.5" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="90;76;90" dur="9s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacity" values="0.15;0.7;0.15" dur="9s" begin="1.2s" repeatCount="indefinite" /></circle><circle cx="200" cy="200" r="2" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="200;186;200" dur="8s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacity" values="0.15;0.7;0.15" dur="8s" begin="0.6s" repeatCount="indefinite" /></circle><circle cx="680" cy="195" r="3" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="195;181;195" dur="10s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacity" values="0.15;0.7;0.15" dur="10s" begin="2.1s" repeatCount="indefinite" /></circle><circle cx="430" cy="44" r="2" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="44;30;44" dur="11s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacity" values="0.15;0.7;0.15" dur="11s" begin="1.6s" repeatCount="indefinite" /></circle><circle cx="830" cy="160" r="2" fill="#FFC107" opacity="0.55"><animate attributeName="cy" values="160;146;160" dur="8.5s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" /><animate attributeName="opacit