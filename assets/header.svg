<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Gabriel Andrei Villanueva - Full Stack Developer, Graphic and UI/UX Designer">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD23F" />
      <stop offset="45%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9016" />
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.7 0; 0.7 0; -0.7 0" dur="9s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9016" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="878" height="248" rx="18" /></clipPath>
  </defs>

  <style>
    .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.15s } .d2 { animation-delay: 0.45s }
    .d3 { animation-delay: 0.75s } .d4 { animation-delay: 1.05s }
    @keyframes in { to { opacity: 1 } }
    @keyframes blink { 50% { opacity: 0 } }
    .caret { animation: blink 1.1s step-end infinite; }
  </style>

  <rect width="880" height="250" rx="18" fill="#0B0B0C" />
  <g clip-path="url(#card)">
