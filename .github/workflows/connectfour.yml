name: Connect Four

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: connectfour
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'c4|')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Play the move
        id: play
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
        run: |
          node game/c4.js "$ISSUE_TITLE" "$ISSUE_ACTOR"
          echo "result=$(cat game/result.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit the new board
        env:
          ACTOR: ${{ github.event.issue.user.login }}
          RESULT: ${{ steps.play.outputs.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --staged --quiet || git commit -m "chore(game): $RESULT (@$ACTOR)"
          git push

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.issue.user.login }}
          RESULT: ${{ steps.play.outputs.result }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" \
            --body "**$RESULT** — board updated on [the profile](https://github.com/$REPO). Thanks for playing, @$ACTOR."
          gh issue close "$ISSUE"
